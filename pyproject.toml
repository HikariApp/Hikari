[project]
name = "hikari"
version = "3.5.5"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.86",
    "discord-ext-voice-recv",
    "discord-py[voice]>=2.7.1",
    "ifaddr>=0.2.0",
    "lava-lyra>=2.2.4",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "tinytag>=2.3.1",
    "typing-extensions>=4.16.0",
    "urllib3>=2.7.0",
]

[tool.uv.sources]
discord-ext-voice-recv = { git = "https://github.com/HikariApp/discord-ext-voice-recv", rev = "main" }
